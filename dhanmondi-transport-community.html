<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dhanmondi Transport Community | Daffodil International University</title>
    <meta name="description" content="University bus schedules, routes and transport notices for the DIU community.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #4F98CA;
            --green: #50D890;
            --mint: #EFFFFB;
            --bg: #EFFFFB;
            --surface: #fff;
            --ink: #12303f;
            --muted: #4a6472;
            --line: #cfe6e6;
            --link: #1d5f93;
            --on-blue: #0b2638;
            --logo-bg: #fff;
            --shadow: 0 6px 24px rgba(31, 95, 147, .12);
            --frame: #4F98CA;
            --frame-ink: #0b2638;
            --hh: 68px
        }

        [data-theme=dark] {
            --bg: #0e1a22;
            --surface: #16262f;
            --ink: #e6f4f4;
            --muted: #9bb5bf;
            --line: #26414d;
            --link: #7dbbe6;
            --logo-bg: #fff;
            --shadow: 0 6px 24px rgba(0, 0, 0, .4);
            --frame: #10212b;
            --frame-ink: #e6f4f4
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px
        }

        body {
            font-family: "Hind Siliguri", system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            font-size: 1rem;
            transition: background .3s, color .3s;
            overflow-x: hidden
        }

        h1,
        h2,
        h3 {
            font-family: Sora, "Hind Siliguri", sans-serif;
            line-height: 1.2
        }

        a {
            color: var(--link)
        }

        :focus-visible {
            outline: 3px solid var(--green);
            outline-offset: 2px
        }

        .wrap {
            width: min(1120px, 100% - 2rem);
            margin-inline: auto
        }

        section {
            padding: 3.5rem 0
        }

        h2 {
            font-size: clamp(1.5rem, 5vw, 2.1rem);
            margin-bottom: .4rem
        }

        .lead {
            color: var(--muted);
            margin-bottom: 1.5rem;
            max-width: 60ch
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            min-height: 46px;
            padding: .6rem 1.1rem;
            border-radius: 999px;
            border: 2px solid var(--blue);
            background: var(--blue);
            color: var(--on-blue);
            font: 600 1rem inherit;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: transform .15s, background .2s
        }

        .btn:hover {
            transform: translateY(-2px)
        }

        .btn.g {
            background: var(--green);
            border-color: var(--green)
        }

        .btn.o {
            background: transparent;
            color: var(--ink)
        }

        /* nav */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--frame);
            color: var(--frame-ink);
            transition: background .3s
        }

        [data-theme=dark] header {
            border-bottom: 1px solid var(--line)
        }

        .nav {
            display: flex;
            align-items: center;
            gap: .75rem;
            min-height: var(--hh);
            padding-inline: clamp(12px, 3.2vw, 44px)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .7rem;
            text-decoration: none;
            color: inherit;
            margin-right: auto;
            min-width: 0
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--logo-bg);
            flex: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .7)
        }

        .brand b {
            font: 700 1rem/1.15 Sora, sans-serif;
            display: block;
            white-space: nowrap
        }

        .brand small {
            font-size: .74rem;
            opacity: .85;
            display: block;
            white-space: nowrap
        }

        .actions {
            display: flex;
            gap: .5rem;
            align-items: center
        }

        .links {
            display: none;
            list-style: none;
            padding: 0;
            margin: 0
        }

        .links a {
            display: block;
            padding: .5rem .85rem;
            border-radius: 999px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 500;
            white-space: nowrap;
            transition: background .2s, color .2s
        }

        .links a:hover {
            background: var(--line)
        }

        .links a.on {
            background: var(--green);
            color: #0b2638;
            font-weight: 700
        }

        .ic {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font: 600 .9rem inherit;
            font-family: inherit;
            transition: border-color .2s, transform .2s
        }

        .ic:hover {
            border-color: var(--green);
            transform: translateY(-1px)
        }

        #menu {
            display: grid;
            place-items: center
        }

        .links.open {
            display: flex;
            flex-direction: column;
            gap: .2rem;
            position: absolute;
            left: 12px;
            right: 12px;
            top: calc(100% + 6px);
            background: var(--surface);
            padding: .6rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 2px solid var(--line)
        }

        .links.open a {
            border-radius: 12px;
            padding: .75rem 1rem
        }

        @media(max-width:520px) {
            .brand b {
                white-space: normal;
                font-size: .82rem
            }

            .brand small {
                display: none
            }

            .brand img,
            .ic {
                width: 40px;
                height: 40px
            }

            .actions {
                gap: .35rem
            }
        }

        @media(min-width:1180px) {
            .nav {
                display: grid;
                grid-template-columns: 1fr auto 1fr
            }

            .actions {
                justify-self: end
            }

            .links {
                display: flex;
                gap: .15rem;
                background: var(--surface);
                padding: .3rem;
                border-radius: 999px;
                box-shadow: var(--shadow)
            }

            #menu {
                display: none
            }
        }

        /* hero */
        .hero {
            --nh: clamp(64px, 9vw, 92px);
            --nw: clamp(150px, 26vw, 260px);
            padding: 0;
            background: var(--frame);
            min-height: calc(100vh - var(--hh));
            min-height: calc(100svh - var(--hh));
            display: flex
        }

        .frame {
            flex: 1;
            display: flex;
            width: 100%;
            padding: 0 clamp(12px, 3.2vw, 44px) clamp(12px, 3.2vw, 44px)
        }

        .shot {
            position: relative;
            flex: 1;
            min-height: 480px;
            border-radius: 26px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            background: #12303f;
            isolation: isolate
        }

        .shot .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2
        }

        .shot .scrim {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, rgba(6, 24, 36, .84), rgba(6, 24, 36, .45) 58%, rgba(6, 24, 36, .08)), linear-gradient(0deg, rgba(6, 24, 36, .5), transparent 40%)
        }

        .hc {
            padding: clamp(1.2rem, 4vw, 3.5rem);
            padding-bottom: calc(var(--nh) + 1.4rem);
            max-width: 760px;
            color: #fff
        }

        .hc h3 {
            color: var(--green);
            font-size: 1.1rem;
            font-weight: 700
        }

        .hc h1 {
            font-size: clamp(2.2rem, 8vw, 4.6rem);
            font-weight: 800;
            letter-spacing: -.02em;
            margin: .5rem 0
        }

        .hc p {
            color: rgba(255, 255, 255, .92);
            max-width: 52ch;
            margin: .8rem 0 1.4rem
        }

        .hc .btn.o {
            color: #fff;
            border-color: #fff
        }

        .notch {
            position: absolute;
            background: var(--frame);
            color: var(--frame-ink);
            display: flex;
            height: var(--nh);
            padding: .4rem 1.1rem
        }

        .notch.tr {
            top: 0;
            right: 0;
            min-width: var(--nw);
            border-bottom-left-radius: 26px;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center
        }

        .notch.bl {
            bottom: 0;
            left: 0;
            align-items: center;
            gap: .7rem;
            padding-right: 1.5rem;
            border-top-right-radius: 26px;
            font-weight: 700;
            font-size: .85rem;
            line-height: 1.2
        }

        .notch.bl img {
            height: calc(var(--nh) - 22px);
            width: auto;
            border-radius: 10px;
            background: #fff;
            padding: 2px
        }

        .clock {
            font: 800 clamp(1.2rem, 3.8vw, 1.9rem)/1 Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .clock-d {
            font-size: .78rem;
            font-weight: 600;
            margin-top: .2rem
        }

        h2:after {
            content: "";
            display: block;
            width: 56px;
            height: 6px;
            border-radius: 3px;
            background: var(--green);
            margin-top: .5rem
        }

        .card {
            border-radius: 22px;
            border: 2px solid var(--line)
        }

        .links.open a {
            color: var(--ink)
        }

        footer .meta {
            color: inherit
        }

        /* quick cards */
        .qgrid,
        .grid {
            display: grid;
            gap: 1rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 1.1rem;
            box-shadow: var(--shadow)
        }

        @media(min-width:640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(min-width:960px) {
            .grid.three {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        /* filters */
        .tools {
            display: grid;
            gap: .6rem;
            margin-bottom: 1.2rem
        }

        .tools input,
        .tools select {
            width: 100%;
            min-height: 46px;
            padding: .5rem .9rem;
            border-radius: 12px;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font: inherit
        }

        @media(min-width:700px) {
            .tools {
                grid-template-columns: 2fr 1fr 1fr
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-bottom: 1.2rem
        }

        .chip {
            min-height: 40px;
            padding: .3rem .9rem;
            border-radius: 999px;
            border: 2px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font: 500 .92rem inherit;
            font-family: inherit;
            cursor: pointer
        }

        .chip[aria-pressed=true] {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue);
            font-weight: 700
        }

        .sample {
            display: inline-block;
            background: rgba(80, 216, 144, .25);
            border: 1px dashed var(--green);
            border-radius: 8px;
            padding: .15rem .6rem;
            font-size: .82rem;
            margin-bottom: 1rem
        }

        .empty {
            padding: 1.5rem;
            text-align: center;
            color: var(--muted);
            border: 2px dashed var(--line);
            border-radius: 16px;
            grid-column: 1/-1
        }

        /* schedule */
        .nextbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .3rem 1rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1.2rem;
            border-radius: 20px;
            background: var(--frame);
            color: var(--frame-ink);
            border-left: 8px solid var(--green)
        }

        .nextbar b {
            font: 800 1.4rem Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .nextbar .lb {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            opacity: .85
        }

        .nextbar .cd {
            margin-left: auto;
            background: var(--green);
            color: #0b2638;
            font-weight: 700;
            padding: .2rem .85rem;
            border-radius: 999px
        }

        .slist {
            display: grid;
            gap: .75rem
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .sch {
            background: var(--surface);
            border: 2px solid var(--line);
            border-radius: 20px;
            overflow: hidden;
            opacity: 0;
            animation: rise .5s cubic-bezier(.2, .7, .2, 1) forwards;
            animation-delay: calc(var(--i)*55ms);
            transition: border-color .25s, box-shadow .25s
        }

        .sch:hover,
        .sch.open {
            border-color: var(--blue);
            box-shadow: var(--shadow)
        }

        .sch.isnext {
            border-color: var(--green)
        }

        .sh {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: .9rem 1rem;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer
        }

        .tb {
            display: grid;
            place-items: center;
            min-width: 84px;
            padding: .55rem .6rem;
            border-radius: 14px;
            background: var(--bg);
            border: 2px solid var(--line);
            transition: background .3s, border-color .3s, color .3s
        }

        .tb b {
            font: 800 1.5rem/1 Sora, sans-serif;
            font-variant-numeric: tabular-nums
        }

        .tb i {
            font-style: normal;
            font-size: .72rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .06em;
            margin-top: .2rem
        }

        .sch:hover .tb,
        .sch.open .tb {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue)
        }

        .sch.isnext .tb {
            background: var(--green);
            border-color: var(--green);
            color: #0b2638
        }

        .sch:hover .tb i,
        .sch.open .tb i,
        .sch.isnext .tb i {
            color: inherit
        }

        .mid strong {
            display: block;
            font-size: 1.02rem
        }

        .mid small {
            color: var(--muted)
        }

        .nx {
            display: none;
            margin-left: .5rem;
            padding: .05rem .6rem;
            border-radius: 999px;
            background: var(--green);
            color: #0b2638;
            font-size: .72rem;
            font-weight: 700;
            vertical-align: middle
        }

        .isnext .nx {
            display: inline-block
        }

        .chev {
            width: 10px;
            height: 10px;
            border: solid var(--muted);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            transition: transform .35s;
            margin-right: .3rem
        }

        .sch.open .chev {
            transform: rotate(-135deg) translate(-2px, -2px)
        }

        .sb {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .4s cubic-bezier(.4, 0, .2, 1)
        }

        .sch.open .sb {
            grid-template-rows: 1fr
        }

        .sb>div {
            overflow: hidden;
            min-height: 0
        }

        .sbi {
            padding: .2rem 1rem 1.1rem;
            border-top: 1px solid var(--line);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .3s .1s, transform .3s .1s
        }

        .sch.open .sbi {
            opacity: 1;
            transform: none
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: .8rem;
            margin: 1rem 0
        }

        .facts span {
            display: block;
            font-size: .74rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .facts b {
            font-weight: 600
        }

        .path {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: .45rem .1rem
        }

        .path li {
            display: flex;
            align-items: center
        }

        .path li:not(:last-child):after {
            content: "›";
            color: var(--blue);
            font-weight: 700;
            margin: 0 .3rem
        }

        .path .p {
            font-size: .9rem;
            padding: .2rem .75rem;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--line)
        }

        .path li:first-child .p {
            background: var(--blue);
            border-color: var(--blue);
            color: var(--on-blue)
        }

        .path li:last-child .p {
            background: var(--green);
            border-color: var(--green);
            color: #0b2638
        }

        @media(max-width:480px) {
            .tb {
                min-width: 70px
            }

            .tb b {
                font-size: 1.3rem
            }
        }

        .ex {
            display: grid;
            grid-template-columns: 76px 1fr;
            gap: 1rem;
            align-items: center;
            margin-bottom: .8rem;
            transition: transform .2s, border-color .2s
        }

        .ex:hover {
            transform: translateX(6px);
            border-color: var(--green)
        }

        .ex.past {
            opacity: .6
        }

        .ex .d {
            border-radius: 16px;
            background: var(--blue);
            color: var(--on-blue);
            text-align: center;
            padding: .5rem 0;
            font: 800 1.8rem/1 Sora, sans-serif
        }

        .ex .d small {
            display: block;
            font: 600 .8rem "Hind Siliguri", sans-serif;
            margin-top: .2rem
        }

        .ex .info {
            display: flex;
            flex-wrap: wrap;
            gap: .2rem 1rem
        }

        .gal {
            display: grid;
            gap: .7rem;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            margin-top: 1rem
        }

        .gal>* {
            aspect-ratio: 4/3;
            border: 0;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            padding: 0;
            background: linear-gradient(135deg, var(--blue), var(--green))
        }

        .gal button {
            cursor: pointer
        }

        .gal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s
        }

        .gal button:hover img,
        .gal button:focus-visible img {
            transform: scale(1.12)
        }

        .gal .ph {
            display: grid;
            place-items: center;
            color: var(--on-blue);
            font-weight: 600;
            font-style: normal;
            opacity: .75
        }

        .gal figcaption {
            position: absolute;
            inset: auto 0 0;
            padding: .4rem .6rem;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: .8rem
        }

        #lb img {
            display: block;
            max-height: 70vh;
            object-fit: contain
        }

        .meta {
            color: var(--muted);
            font-size: .9rem
        }

        .tag {
            display: inline-block;
            padding: .05rem .6rem;
            border-radius: 999px;
            background: var(--line);
            font-size: .8rem;
            margin: .15rem .2rem 0 0
        }

        /* routes */
        .stops {
            list-style: none;
            padding: 0;
            margin: .8rem 0 0;
            position: relative
        }

        .stops li {
            position: relative;
            padding: 0 0 .9rem 1.8rem
        }

        .stops li:before {
            content: "";
            position: absolute;
            left: 5px;
            top: .45rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--surface);
            border: 3px solid var(--blue);
            z-index: 1
        }

        .stops li:after {
            content: "";
            position: absolute;
            left: 10px;
            top: 1rem;
            bottom: -.3rem;
            width: 2px;
            background: var(--blue)
        }

        .stops li:last-child:after {
            display: none
        }

        .stops li:last-child:before {
            border-color: var(--green);
            background: var(--green)
        }

        /* notices */
        .notice {
            display: flex;
            flex-direction: column;
            gap: .5rem
        }

        .notice.imp {
            border-left: 6px solid var(--green)
        }

        .badge {
            align-self: flex-start;
            padding: .1rem .7rem;
            border-radius: 999px;
            background: var(--blue);
            color: var(--on-blue);
            font-size: .8rem;
            font-weight: 700
        }

        .badge.u {
            background: var(--green)
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: auto
        }

        .row .btn {
            min-height: 40px;
            font-size: .92rem;
            padding: .3rem .9rem
        }

        .nopdf {
            font-size: .85rem;
            color: var(--muted)
        }

        dialog {
            border: 0;
            border-radius: 20px;
            padding: 1.5rem;
            width: min(560px, 100% - 2rem);
            background: var(--surface);
            color: var(--ink);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4)
        }

        dialog::backdrop {
            background: rgba(5, 20, 30, .6)
        }

        /* uni / about / contact */
        .uni {
            display: grid;
            gap: 1.5rem
        }

        .uni .lg {
            background: var(--logo-bg);
            border-radius: 20px;
            padding: 1rem;
            display: grid;
            place-items: center;
            border: 1px solid var(--line)
        }

        .uni .lg img {
            width: min(220px, 100%);
            height: auto
        }

        @media(min-width:800px) {
            .uni {

            { id: "r2", name: { en: "Route 2: Dhanmondi to DSC", bn: "রুট ২: ধানমন্ডি থেকে DSC" }, from: P, to: S.dsc, stops: ks(["tech", "mazar", "bera", "biru", "dsc"]) },
            { id: "r1r", name: { en: "Route 1 (Return): DSC to Dhanmondi", bn: "রুট ১ (ফেরা): DSC থেকে ধানমন্ডি" }, from: S.dsc, to: P, stops: ks([...FULL].reverse()) },
            { id: "r2r", name: { en: "Route 2 (Return): DSC to Technical", bn: "রুট ২ (ফেরা): DSC থেকে টেকনিক্যাল" }, from: S.dsc, to: S.tech, stops: ks(["dsc", "biru", "bera", "mazar", "tech"]) }];
        const WK = ["sat", "sun", "mon", "tue", "wed", "thu"], FR = ["fri"];
        const BUSES = [
            { route: "r1", dep: "07:00", days: WK }, { route: "r1", dep: "10:00", days: WK }, { route: "r1", dep: "07:30", days: FR },
            { route: "r2", dep: "12:00", days: WK },
            { route: "r1r", dep: "13:30", days: WK }, { route: "r1r", dep: "16:20", days: WK }, { route: "r1r", dep: "18:00", days: WK }, { route: "r1r", dep: "11:20", days: FR }, { route: "r1r", dep: "16:20", days: FR },
            { route: "r2r", dep: "11:00", days: WK }];
        const NOTICES = [
            { id: 1, date: "2026-11-01", cat: "schedule", level: "important", title: { en: "Sample: schedule update notice", bn: "নমুনা: সময়সূচি হালনাগাদ নোটিশ" }, body: { en: "This is a sample notice showing how an official update will look, including a PDF.", bn: "এটি একটি নমুনা নোটিশ, যেখানে অফিসিয়াল হালনাগাদ ও PDF কেমন দেখাবে তা দেখানো হয়েছে।" }, pdf: "notices/sample-notice.pdf", pdfTitle: "sample-notice.pdf" },
            { id: 2, date: "2026-10-20", cat: "general", level: "", title: { en: "Sample: general announcement", bn: "নমুনা: সাধারণ ঘোষণা" }, body: { en: "Sample announcement without an attached PDF.", bn: "PDF ছাড়া একটি নমুনা ঘোষণা।" }, pdf: null },
            { id: 3, date: "2026-10-05", cat: "emergency", level: "urgent", title: { en: "Sample: emergency notice", bn: "নমুনা: জরুরি নোটিশ" }, body: { en: "Sample of how urgent notices are highlighted.", bn: "জরুরি নোটিশ কীভাবে হাইলাইট হবে তার নমুনা।" }, pdf: null }];

        /* ---- State & helpers ---- */
        let lang = load("dtc-lang", "en"), theme = load("dtc-theme", "light"), cat = "all", showAll = false;
        const t = k => T[lang][k] ?? T.en[k], L = o => o[lang] || o.en;
        const fmtD = iso => new Intl.DateTimeFormat(lang === "bn" ? "bn-BD" : "en-GB", { dateStyle: "medium", timeZone: "Asia/Dhaka" }).format(new Date(iso + "T00:00:00+06:00"));
        const nf = s => lang === "bn" ? s.replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]) : s;
        const fmtT = s => { const [h, m] = s.split(":").map(Number); return nf(`${(h % 12) || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`).replace(/AM|PM/, x => lang === "bn" ? (x === "AM" ? "পূর্বাহ্ণ" : "অপরাহ্ণ") : x) };
        const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e };
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        /* ---- Clock (Asia/Dhaka) ---- */
        function tick() {
            const d = new Date(), loc = lang === "bn" ? "bn-BD" : "en-GB";
            $("#clock").textContent = new Intl.DateTimeFormat(loc, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Dhaka" }).format(d);
            $("#date").textContent = new Intl.DateTimeFormat(loc, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Dhaka" }).format(d); updateNext()
        }

        /* ---- Schedule ---- */
        function fillSelects() {
            const r = $("#fRoute"), d = $("#fDay"), rv = r.value, dv = d.value;
            r.innerHTML = `<option value="">${t("allRoutes")}</option>` + ROUTES.map(x => `<option value="${x.id}">${esc(L(x.name))}</option>`).join("");
            d.innerHTML = `<option value="">${t("allDays")}</option>` + Object.keys(T.en.dayN).map(k => `<option value="${k}">${t("dayN")[k]}</option>`).join("");
            r.value = rv; d.value = dv
        }
        function dayStr(d) { return d.length === 6 && !d.includes("fri") ? t("satThu") : d.map(k => t("dayN")[k]).join(", ") }
        function tp(d) { const f = fmtT(d), i = f.lastIndexOf(" "); return [f.slice(0, i), f.slice(i + 1)] }
        function dhakaNow() { const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Dhaka", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value])); return { day: p.weekday.toLowerCase().slice(0, 3), min: (+p.hour % 24) * 60 + +p.minute } }
        function nextBus() {
            const n = dhakaNow(), o = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"], i0 = o.indexOf(n.day);
            for (let d = 0; d < 8; d++) {
                const k = o[(i0 + d) % 7], c = BUSES.filter(b => b.days.includes(k)).map(b => ({ b, m: +b.dep.slice(0, 2) * 60 + +b.dep.slice(3) })).filter(x => d > 0 || x.m > n.min).sort((a, c) => a.m - c.m)[0];
                if (c) return { bus: c.b, d, k, wait: d * 1440 + c.m - n.min }
            } return null
        }
        function updateNext() {
            const bar = $("#nextBar"), nb = nextBus(); if (!bar || !nb) return; const r = ROUTES.find(x => x.id === nb.bus.route), h = Math.floor(nb.wait / 60), m = nb.wait % 60;
            const cd = nb.d > 0 ? t("dayN")[nb.k] : (lang === "bn" ? nf(`${h ? h + " ঘণ্টা " : ""}${m} মিনিট পরে`) : `in ${h ? h + "h " : ""}${m}m`);
            const html = `<span class="lb">${t("nextBus")}</span><b>${fmtT(nb.bus.dep)}</b><span>${esc(L(r.name))}</span><span class="cd">${cd}</span>`;
            if (bar.dataset.h !== html) { bar.innerHTML = html; bar.dataset.h = html }
            const bi = BUSES.indexOf(nb.bus); $$(".sch").forEach(c => c.classList.toggle("isnext", +c.dataset.k === bi))
        }
        function renderSchedule() {
            const q = $("#q").value.trim().toLowerCase(), fr = $("#fRoute").value, fd = $("#fDay").value, box = $("#schList"); box.innerHTML = "";
            const idx = id => ROUTES.findIndex(x => x.id === id);
            const list = BUSES.filter(b => {
                const r = ROUTES.find(x => x.id === b.route);
                const hay = [r.name.en, r.name.bn, ...r.stops.map(x => x.en + " " + x.bn), b.dep].join(" ").toLowerCase();
                return (!q || hay.includes(q)) && (!fr || b.route === fr) && (!fd || b.days.includes(fd))
            }).sort((a, b) => idx(a.route) - idx(b.route) || a.days.includes("fri") - b.days.includes("fri") || a.dep.localeCompare(b.dep));
            if (!list.length) return box.append(el("p", "empty", t("none")));
            list.forEach((b, i) => {
                const r = ROUTES.find(x => x.id === b.route), [tm, ap] = tp(b.dep), c = el("article", "sch");
                c.style.setProperty("--i", i); c.dataset.k = BUSES.indexOf(b);
                c.innerHTML = `<button class="sh" type="button" aria-expanded="false"><span class="tb"><b>${tm}</b><i>${ap}</i></span><span class="mid"><strong>${esc(L(r.name))}<span class="nx">${t("nextL")}</span></strong><small>${esc(L(r.from))} – ${esc(L(r.to))} · ${dayStr(b.days)}</small></span><span class="chev"></span></button>
<div class="sb"><div><div class="sbi"><div class="facts"><div><span>${t("from")}</span><b>${esc(L(r.from))}</b></div><div><span>${t("to")}</span><b>${esc(L(r.to))}</b></div><div><span>${t("dep")}</span><b>${fmtT(b.dep)}</b></div><div><span>${t("days")}</span><b>${dayStr(b.days)}</b></div></div>
<ol class="path">${r.stops.map(x => `<li><span class="p">${esc(L(x))}</span></li>`).join("")}</ol></div></div></div>`;
                $(".sh", c).onclick = e => { const o = c.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o) };
                box.append(c)
            }); updateNext()
        }

        /* ---- Routes ---- */
        function renderRoutes() {
            const box = $("#rtList"); box.innerHTML = "";
            ROUTES.forEach(r => {
                const c = el("article", "card"), g = {};
                BUSES.filter(b => b.route === r.id).forEach(b => { const k = dayStr(b.days); (g[k] = g[k] || []).push(b.dep) });
                c.innerHTML = `<h3>${esc(L(r.name))}</h3><ul class="stops">${r.stops.map(x => `<li>${esc(L(x))}</li>`).join("")}</ul>` + Object.entries(g).map(([k, v]) => `<p class="meta">${k}: ${v.sort().map(fmtT).join(", ")}</p>`).join(""); box.append(c)
            })
        }

        /* ---- Notices ---- */
        function renderCats() {
            const b = $("#nCats"); b.innerHTML = "";
            ["all", ...Object.keys(T.en.cats)].forEach(k => { const x = el("button", "chip", k === "all" ? t("all") : t("cats")[k]); x.type = "button"; x.setAttribute("aria-pressed", k === cat); x.onclick = () => { cat = k; renderCats(); renderNotices() }; b.append(x) })
        }
        function pdfBtns(n) { return n.pdf ? `<a class="btn" href="${n.pdf}" target="_blank" rel="noopener">${t("pdfOpen")}</a><a class="btn g" href="${n.pdf}" download>${t("pdfDl")}</a>` : `<span class="nopdf">${t("noPdf")}</span>` }
        function renderNotices() {
            const q = $("#nq").value.trim().toLowerCase(), box = $("#notList"); box.innerHTML = "";
            let list = NOTICES.filter(n => (cat === "all" || n.cat === cat) && (!q || (L(n.title) + L(n.body)).toLowerCase().includes(q))).sort((a, b) => b.date.localeCompare(a.date));
            $("#viewAll").hidden = showAll || list.length <= 2; if (!showAll) list = list.slice(0, 6);
            if (!list.length) return box.append(el("p", "empty", t("none")));
            list.forEach(n => {
                const c = el("article", "card notice" + (n.level ? " imp" : ""));
                c.innerHTML = `<span class="badge ${n.level === "urgent" ? "u" : ""}">${t("cats")[n.cat]}${n.level ? " · " + t(n.level) : ""}</span>
<h3>${esc(L(n.title))}</h3><div class="meta">${fmtD(n.date)} · ${t("sampleTag")}</div><p>${esc(L(n.body))}</p>
<div class="row"><button class="btn o" type="button">${t("viewMore")}</button>${pdfBtns(n)}</div>`;
                $("button", c).onclick = () => openNotice(n); box.append(c)
            })
        }
        function openNotice(n) {
            $("#dT").textContent = L(n.title); $("#dM").textContent = `${t("cats")[n.cat]} · ${fmtD(n.date)}`; $("#dB").textContent = L(n.body);
            $("#dA").innerHTML = pdfBtns(n) + `<button class="btn o" type="button" id="dc">${t("close")}</button>`; $("#dc").onclick = () => $("#dlg").close(); $("#dlg").showModal()
        }


        /* ---- Exam schedule (sample) ---- */
        const EXAMS = [
            { type: "mid", title: { en: "Sample Midterm Exam: Day 1", bn: "নমুনা মিডটার্ম পরীক্ষা: ১ম দিন" }, date: "2026-11-14", start: "09:00", end: "11:00", route: "r1", bus: "07:30" },
            { type: "mid", title: { en: "Sample Midterm Exam: Day 2", bn: "নমুনা মিডটার্ম পরীক্ষা: ২য় দিন" }, date: "2026-11-15", start: "11:30", end: "13:30", route: "r1", bus: "09:30" },
            { type: "final", title: { en: "Sample Final Exam: Day 1", bn: "নমুনা ফাইনাল পরীক্ষা: ১ম দিন" }, date: "2026-12-20", start: "09:00", end: "12:00", route: "r1", bus: "07:30" },
            { type: "final", title: { en: "Sample Final Exam: Day 2", bn: "নমুনা ফাইনাল পরীক্ষা: ২য় দিন" }, date: "2026-12-22", start: "14:00", end: "17:00", route: "r1r", bus: "12:30" }];
        let exCat = "all";
        function renderExams() {
            const tabs = $("#exTabs"), box = $("#exList"); tabs.innerHTML = ""; box.innerHTML = "";
            [["all", t("exAll")], ["mid", t("exMid")], ["final", t("exFinal")]].forEach(([k, n]) => { const x = el("button", "chip", n); x.type = "button"; x.setAttribute("aria-pressed", k === exCat); x.onclick = () => { exCat = k; renderExams() }; tabs.append(x) });
            const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dhaka" }).format(new Date());
            EXAMS.filter(x => exCat === "all" || x.type === exCat).sort((a, b) => a.date.localeCompare(b.date)).forEach(x => {
                const r = ROUTES.find(y => y.id === x.route), past = x.date < today, c = el("article", "card ex" + (past ? " past" : ""));
                const mon = new Intl.DateTimeFormat(lang === "bn" ? "bn-BD" : "en-GB", { month: "short", timeZone: "Asia/Dhaka" }).format(new Date(x.date + "T00:00:00+06:00"));
                c.innerHTML = `<div class="d">${nf(String(+x.date.slice(8)))}<small>${mon}</small></div><div><h3>${esc(L(x.title))}</h3>
<div class="info meta"><span>${fmtD(x.date)}</span><span>${fmtT(x.start)} – ${fmtT(x.end)}</span><span>${t("exBus")}: ${fmtT(x.bus)} (${esc(L(r.name))})</span></div>
<span class="tag">${past ? t("exPast") : t("exUp")}</span> <span class="tag">${t("sampleTag")}</span></div>`; box.append(c)
            })
        }

        /* ---- Gallery ---- */
        const GALLERY = []; /* add official photos: {src:"photos/a.jpg",cap:{en:"…",bn:"…"}} */
        let userPics = [], lbi = 0;
        function renderGallery() {
            const g = $("#gal"); g.innerHTML = ""; const all = [...GALLERY, ...userPics];
            if (!all.length) { for (let i = 0; i < 6; i++)g.append(el("div", "ph", t("gPh"))); g.insertAdjacentElement("beforebegin", $("#gEmpty") || Object.assign(el("p", "meta", t("gEmpty")), { id: "gEmpty" })); $("#gEmpty").textContent = t("gEmpty"); return }
            $("#gEmpty")?.remove();
            all.forEach((p, i) => {
                const b = el("button", ""); b.type = "button"; const cap = p.cap ? L(p.cap) : ""; b.setAttribute("aria-label", cap || "Photo " + (i + 1));
                b.innerHTML = `<img src="${p.src}" alt="${esc(cap)}" loading="lazy">${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}`; b.onclick = () => openLb(i); g.append(b)
            })
        }
        function openLb(i) {
            const all = [...GALLERY, ...userPics]; if (!all.length) return; lbi = (i + all.length) % all.length; const p = all[lbi];
            $("#lbI").src = p.src; $("#lbI").alt = p.cap ? L(p.cap) : ""; $("#lbC").textContent = p.cap ? L(p.cap) : ""; if (!$("#lb").open) $("#lb").showModal()
        }
        $("#lbP").onclick = () => openLb(lbi - 1); $("#lbN").onclick = () => openLb(lbi + 1); $("#lbX").onclick = () => $("#lb").close();
        $("#gFile").addEventListener("change", e => { [...e.target.files].forEach(f => userPics.push({ src: URL.createObjectURL(f), cap: { en: f.name, bn: f.name } })); e.target.value = ""; renderGallery() });

        /* ---- Language & theme ---- */
        function applyLang() {
            document.documentElement.lang = lang;
            $$("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
            $$("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
            $("#lang").textContent = lang === "en" ? "বাং" : "EN"; $("#lang").setAttribute("aria-label", lang === "en" ? "বাংলায় দেখুন" : "Switch to English");
            fillSelects(); renderSchedule(); renderRoutes(); renderCats(); renderNotices(); renderExams(); renderGallery(); tick()
        }
        function applyTheme() { document.documentElement.dataset.theme = theme; $("#theme").textContent = theme === "dark" ? "☀️" : "🌙" }
        $("#lang").onclick = () => { lang = lang === "en" ? "bn" : "en"; save("dtc-lang", lang); applyLang() };
        $("#theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; save("dtc-theme", theme); applyTheme() };
        ["#q", "#fRoute", "#fDay"].forEach(s => $(s).addEventListener("input", renderSchedule));
        $("#nq").addEventListener("input", renderNotices);
        $("#viewAll").onclick = () => { showAll = true; renderNotices() };

        /* ---- Nav ---- */
        const menu = $("#menu"), links = $("#links");
        menu.onclick = () => { const o = links.classList.toggle("open"); menu.setAttribute("aria-expanded", o) };
        $$("#links a").forEach(a => a.addEventListener("click", () => { links.classList.remove("open"); menu.setAttribute("aria-expanded", false) }));
        $("#top").onclick = () => scrollTo({ top: 0 });
        const secs = ["home", "schedule", "exams", "routes", "notices", "gallery", "about", "contact"].map(id => $("#" + id));
        addEventListener("scroll", () => {
            $("#top").classList.toggle("show", scrollY > 500);
            let cur = "home"; secs.forEach(s => { if (s.getBoundingClientRect().top < 120) cur = s.id });
            $$("#links a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur))
        }, { passive: true });

        /* logo fallback: hide broken images gracefully */
        $$("img").forEach(i => i.addEventListener("error", () => { i.style.visibility = "hidden" }));
        applyTheme(); applyLang(); setInterval(tick, 1000);
    </script>
</body>

</html>
